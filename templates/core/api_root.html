<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ name }} — API</title>
        <style>
            :root {
                --bg: #0b0d12;
                --surface: #12151c;
                --border: #232732;
                --text: #e6e8ec;
                --muted: #8b93a3;
                --accent: #6ee7b7;
                --mono:
                    "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
                    monospace;
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #f7f8fa;
                    --surface: #ffffff;
                    --border: #e4e7ec;
                    --text: #14161a;
                    --muted: #5b6472;
                    --accent: #0f9d68;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                display: flex;
                justify-content: center;
                padding: 6vh 20px;
            }
            main {
                width: 100%;
                max-width: 640px;
            }
            header {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                margin-bottom: 8px;
            }
            h1 {
                font-size: 1.5rem;
                margin: 0;
                letter-spacing: -0.02em;
            }
            .badge {
                font-family: var(--mono);
                font-size: 0.75rem;
                color: var(--accent);
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 3px 10px;
                background: var(--surface);
            }
            .sub {
                color: var(--muted);
                font-size: 0.9rem;
                margin: 0 0 32px;
            }
            .sub span {
                color: var(--accent);
                font-weight: 600;
            }
            ul.endpoints {
                list-style: none;
                margin: 0;
                padding: 0;
                border: 1px solid var(--border);
                border-radius: 10px;
                overflow: hidden;
                background: var(--surface);
            }
            ul.endpoints li {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 14px 18px;
                border-bottom: 1px solid var(--border);
            }
            ul.endpoints li:last-child {
                border-bottom: none;
            }
            .label {
                font-weight: 600;
                font-size: 0.9rem;
                text-transform: capitalize;
            }
            .url {
                font-family: var(--mono);
                font-size: 0.82rem;
                color: var(--muted);
                text-decoration: none;
                overflow-wrap: anywhere;
                text-align: right;
            }
            .url:hover {
                color: var(--accent);
            }
            .stack {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: 20px 0 0;
            }
            .stack span {
                font-family: var(--mono);
                font-size: 0.75rem;
                color: var(--muted);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 4px 9px;
                background: var(--surface);
            }
            footer {
                margin-top: 28px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                color: var(--muted);
                font-size: 0.78rem;
                text-align: center;
            }
            footer a {
                color: var(--muted);
                text-decoration: underline;
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            footer a:hover {
                color: var(--accent);
            }
            footer svg {
                width: 14px;
                height: 14px;
                fill: currentColor;
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <h1>{{ name }}</h1>
                <span class="badge">{{ status }}</span>
            </header>
            <p class="sub">version <span>{{ version }}</span></p>

            <ul class="endpoints">
                {% for label, url in endpoints.items %}
                <li>
                    <span class="label">{{ label }}</span>
                    <a class="url" href="{{ url }}">{{ url }}</a>
                </li>
                {% endfor %}
            </ul>

            <div class="stack">
                {% for tech in stack %}
                <span>{{ tech }}</span>
                {% endfor %}
            </div>

            <footer>
                JSON available at this URL via
                <code>Accept: application/json</code>
                ·
                <a href="{{ repo_url }}">
                    <svg viewBox="0 0 16 16">
                        <path
                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
        1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
        0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27
        2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
        1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
        0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                        />
                    </svg>
                    source on GitHub
                </a>
            </footer>
        </main>
    </body>
</html>
